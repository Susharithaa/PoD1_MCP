openapi: 3.0.3
info:
  title: Sample MCP Demo Weather API
  version: 1.0.0
  description: >-
    A small local FastAPI demo API spec for MCP Hub upload and Chat Builder testing.

    **Local dev:** the server below points to localhost:9001.
    Start the demo server first: `uvicorn demo_weather_server:app --port 9001`

    **Production / CI:** change the server URL to your public base URL
    or set `ALLOW_PRIVATE_TOOL_HOSTS=true` in the backend `.env` for local runs.

servers:
  - url: http://localhost:9001
    description: Local development server (requires ALLOW_PRIVATE_TOOL_HOSTS=true in backend .env)

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      tags: [System]
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: weather-demo

  /weather/{city}:
    get:
      summary: Get sample weather for a city
      operationId: getWeather
      tags: [Weather]
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
          description: City name to get sample weather for.
          example: London
      responses:
        "200":
          description: Weather response
          content:
            application/json:
              schema:
                type: object
                properties:
                  city:
                    type: string
                  temperature_c:
                    type: number
                  condition:
                    type: string
                  updated_at:
                    type: string
                    format: date-time

  /forecast/{city}:
    get:
      summary: Get sample 7-day forecast for a city
      operationId: getForecast
      tags: [Weather]
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
          description: City name to get forecast for.
          example: Paris
      responses:
        "200":
          description: Forecast response
          content:
            application/json:
              schema:
                type: object
                properties:
                  city:
                    type: string
                  daily:
                    type: array
                    items:
                      type: object
                      properties:
                        day:
                          type: string
                        summary:
                          type: string
                        high_c:
                          type: number
                        low_c:
                          type: number

  /summary/{city}:
    get:
      summary: Get a short weather recommendation for a city
      operationId: getWeatherSummary
      tags: [Weather]
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
          description: City name to get a short recommendation for.
          example: Tokyo
      responses:
        "200":
          description: Weather summary response
          content:
            application/json:
              schema:
                type: object
                properties:
                  city:
                    type: string
                  summary:
                    type: string
                  recommendation:
                    type: string

  /chat:
    post:
      summary: Send a prompt to Azure OpenAI via the demo server
      operationId: chatWithAzureOpenAI
      tags: [AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: Prompt to send to Azure OpenAI.
                  example: What is the weather like today?
      responses:
        "200":
          description: Chat completion response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  model:
                    type: string
                  message:
                    type: string
                  response:
                    type: string

  /reports:
    post:
      summary: Create a sample report
      operationId: createReport
      tags: [Reports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Arbitrary report payload
      responses:
        "200":
          description: Report creation response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  received:
                    type: object
                  id:
                    type: string

  /reports/{report_id}:
    get:
      summary: Retrieve a sample report by ID
      operationId: getReport
      tags: [Reports]
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
          description: Report identifier.
          example: rpt_001
      responses:
        "200":
          description: Report response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  status:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        amount:
                          type: number
