openapi: 3.0.3
info:
  title: Sample MCP Demo API
  version: 1.0.0
  description: A small FastAPI demo API for MCP Hub upload and Chat Builder testing.
servers:
  - url: http://localhost:9001
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string

  /weather:
    get:
      summary: Get sample weather
      operationId: getWeather
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
            default: Chennai
          description: City name to get sample weather for.
      responses:
        "200":
          description: Weather response
          content:
            application/json:
              schema:
                type: object
                properties:
                  city:
                    type: string
                  temperature_c:
                    type: number
                  condition:
                    type: string
                  updated_at:
                    type: string
                    format: date-time

  /forecast/{city}:
    get:
      summary: Get sample forecast
      operationId: getForecast
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
          description: City name to get forecast for.
      responses:
        "200":
          description: Forecast response
          content:
            application/json:
              schema:
                type: object
                properties:
                  city:
                    type: string
                  daily:
                    type: array
                    items:
                      type: object
                      properties:
                        day:
                          type: string
                        summary:
                          type: string
                        high_c:
                          type: number
                        low_c:
                          type: number

  /reports:
    post:
      summary: Create sample report
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Report creation response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  received:
                    type: object
                  id:
                    type: string

  /reports/{report_id}:
    get:
      summary: Get sample report
      operationId: getReport
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
          description: Report identifier.
      responses:
        "200":
          description: Report response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  status:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        amount:
                          type: number
