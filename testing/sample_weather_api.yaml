openapi: 3.0.3
info:
  title: Open-Meteo Weather API
  version: 1.0.0
  description: A small public weather API spec for MCP Hub upload testing.
servers:
  - url: https://api.open-meteo.com
paths:
  /v1/forecast:
    get:
      summary: Get weather forecast
      operationId: getWeatherForecast
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
          description: Latitude in WGS84 coordinates.
        - name: longitude
          in: query
          required: true
          schema:
            type: number
          description: Longitude in WGS84 coordinates.
        - name: current
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated current weather variables.
        - name: hourly
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated hourly weather variables.
        - name: forecast_days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 16
            default: 3
          description: Number of forecast days to return.
      responses:
        "200":
          description: Weather forecast response
          content:
            application/json:
              schema:
                type: object
                properties:
                  latitude:
                    type: number
                  longitude:
                    type: number
                  generationtime_ms:
                    type: number
                  current:
                    type: object
                    additionalProperties: true
                  hourly:
                    type: object
                    additionalProperties: true