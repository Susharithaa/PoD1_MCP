openapi: 3.0.3
info:
  title: Sample MCP Demo Weather API
  version: 1.0.0
  description: A small local FastAPI demo API spec for MCP Hub upload and Chat Builder testing.
servers:
  - url: http://localhost:9001
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string

  /weather/{city}:
    get:
      summary: Get sample weather
      operationId: getWeather
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
          description: City name to get sample weather for.
      responses:
        "200":
          description: Weather response
          content:
            application/json:
              schema:
                type: object
                properties:
                  city:
                    type: string
                  temperature_c:
                    type: number
                  condition:
                    type: string
                  updated_at:
                    type: string
                    format: date-time

  /forecast/{city}:
    get:
      summary: Get sample forecast
      operationId: getForecast
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
          description: City name to get forecast for.
      responses:
        "200":
          description: Forecast response
          content:
            application/json:
              schema:
                type: object
                properties:
                  city:
                    type: string
                  daily:
                    type: array
                    items:
                      type: object
                      properties:
                        day:
                          type: string
                        summary:
                          type: string
                        high_c:
                          type: number
                        low_c:
                          type: number

  /summary/{city}:
    get:
      summary: Get sample weather summary
      operationId: getWeatherSummary
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
          description: City name to get a short recommendation for.
      responses:
        "200":
          description: Weather summary response
          content:
            application/json:
              schema:
                type: object
                properties:
                  city:
                    type: string
                  summary:
                    type: string
                  recommendation:
                    type: string

  /chat:
    post:
      summary: Chat with Azure OpenAI
      operationId: chatWithAzureOpenAI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: Prompt to send to Azure OpenAI.
      responses:
        "200":
          description: Chat completion response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  model:
                    type: string
                  message:
                    type: string
                  response:
                    type: string

  /reports:
    post:
      summary: Create sample report
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Report creation response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  received:
                    type: object
                  id:
                    type: string

  /reports/{report_id}:
    get:
      summary: Get sample report
      operationId: getReport
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
          description: Report identifier.
      responses:
        "200":
          description: Report response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  status:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        amount:
                          type: number
